<html>
<head>
</head>
<body>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <style>
       body {
         overflow:hidden;
         touch-action: none;
         position:fixed;
       }
</style>
<canvas id="kanvasGame"></canvas>

  <!-- Import File Library Lokal -->
<script src="actor.js"></script>
    <script src="joystick.js"></script>
    <script src="physics.js"></script>
    <script src="sprite.js"></script>
<script>
let kanvas =  document.getElementById("kanvasGame");
kanvas.width = 1000;
kanvas.height = 1500;
let ctx = kanvas.getContext('2d');

addCanvasToLib("kanvasGame"); // Daftarkan kanvas ke library

let player = { //buat objek player
        name:"player",
        x:160,y:450,
        w:12,h:12,
        type:"rect",
	border:true
};


let button = { //buat objek tombol ngegas
        name:"button",
	x:260,y:500,
	a:40,b:20,
        type:"rect",
	click : ngegas,
	unclick : normal
};

let obstekel = {
	name:"obstekel",
	x:200,y:50,
	a:70,b:50,
	type:"rect",
	vy:0
};

let batasbawah = { //batas bawah, tidak dirender
	name: "batasbawah",
	x:160, y:600,
	a:500, b:10,
	type:"rect",
	border:true
};

let munculkanproyektil = false; //fungsi munculkan proyektil jika ngegas ditekan

let partikel = {};
function createPartikel(nama,banyak=1) {
	let part = [];
	for (let i = 0; i<banyak; i++) {
		let namaId = "proyektil" + i;
		let proyektil = {
                        name:namaId,
                        x:-99,y:-99,
                        a:2, b:2
                }; 
		part.push(namaId);
		createElement(proyektil);
	}
	partikel[nama] = part;
}
createPartikel("proyektil",50);

let ngulang;

function ngegas() {
	editJoyStick("joyStick0","velocity",{vx:10,vy:10});
	munculkanproyektil = true;
	let i = 0;
	ngulang = setInterval(()=> {
		let nama = "proyektil" + i;
		editProp(nama,"x",getProp("player","x"));
		editProp(nama,"y",getProp("player","y"));
		editProp(nama,"vx",getVelocityPartial(20,
                                -(getJoyStick("joyStick0","sudut")+Math.PI/2)+
                                (Math.random()-0.5)/3).vx);
		editProp(nama,"vy",getVelocityPartial(20,
                                -(getJoyStick("joyStick0","sudut")+Math.PI/2)+
                                (Math.random()-0.5)/3).vy);
		editProp(nama,"gravitasi",true);
                setTimeout(()=> {editProp(nama,"vy",5);editProp(nama,"vx",0);},700);
                setTimeout(()=> editProp(nama,"vy",16),1000);
		i++;
		if (i>= (partikel.proyektil).length) i=0;
	},50);
}
function normal() {      
	editJoyStick("joyStick0","velocity",{vx:5,vy:5});
	clearInterval(ngulang);
}

// tambahkan obejek menjadi elemen
createElement(player);
createElement(button);
createElement(obstekel);
createElement(batasbawah);

createJoyStick(80,500,30); // buat joystick
editJoyStick("joyStick0","attach","player"); // sambungkan joystick dengan playwr
editJoyStick("joyStick0", "style", { //ubah style joystick
            'bg-color': 'rgba(255, 255, 255, 0.2)',
            'color': '#000000',
            'bd-color': '#ffffff',
            'border': 2
});

editJoyStick("joyStick0","velocity",{vx:5,vy:5}); //atur kecepatan awal

let nyawaObst = 500; //nyawa sebuah obstekel

let score = 0; //score

function update() {
	ctx.clearRect(0,0,kanvasGame.width,kanvasGame.height); //reset canvas

	updateMovement(); // update pergerakan

	// jika player dibawah, player bergerak, jika diatas,obstek bergerak
	if (getProp("player","y") <200) {
		editProp("player","y",200);
		editProp("obstekel","vy",getJoyStick("joyStick0","joyVy"));
	} else {
		editProp("obstekel","vy",0);
	}

	// munculkan proyektil jika ngebut, tombol dipencet
	

	// jika obstekel kena proyektil, nyawa obstekel berkurang,
	// jika proyektil kena batas, hancur / hilang
	for (let i = 0; i< (partikel.proyektil).length; i++) {
		let nama = "proyektil" + i;
		renderObjek(nama);
		if (isCollision(nama,"obstekel")) nyawaObst--;
		if (isCollision(nama,"batasbawah")) {
			editProp(nama,"x",-99);
			editProp(nama,"y",-99);
			editProp(nama,"vx",0);
			editProp(nama,"gravitasi",false);
		}
	}

	// jika nyawa obstekel habis, reset nyawa dan set posisi random,
	if (nyawaObst < 0) {
		nyawaObst = 500;
		score++;
		editProp("obstekel","y",-50);
		editProp("obstekel","x",Math.random()*400);
		editProp("obstekel","a",Math.random()*300);
	}


	// Rwndering
	renderObjek("player");
        renderObjek("button");
	renderObjek("obstekel",`rgba(0,0,0, ${nyawaObst/600+1/6})`);
	let sudutjoy = getJoyStick("joyStick0","sudut");
	let xbox1 = getProp("player","x");
	let ybox1 = getProp("player","y");
	renderRect(xbox1-2.5,ybox1,5,20,sudutjoy,50,0);
	renderJoyStick("joyStick0");
	ctx.fillStyle = "black";
        ctx.font = "40px Arial";
        ctx.fillText("Score :"+score,100,650);


	// Jika kalah alias playwr terkena obstekel
	if (isCollision("player","obstekel")) {
		alert("Kamu Kalah! Dengan Score : "+ score +".");
		editProp("player","x",9000);
		location.reload();
	}

	// jika obstekel mengenai bawah
	if (isCollision("obstekel","batasbawah")) {
		nyawaObst = 500;
                editProp("obstekel","y",-50);
                editProp("obstekel","x",Math.random()*400);
                editProp("obstekel","a",Math.random()*300);
        }

	requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
