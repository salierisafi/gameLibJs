<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
 <style>
       body {
         overflow:hidden;
         touch-action: none;
         position:fixed;
       }
</style>
<canvas id="kanvasGame"></canvas>
<script src="https://cdn.jsdelivr.net/npm/eruda" onload="eruda.init()"></script>

<script src="https://cdn.jsdelivr.net/gh/salierisafi/gameLibJs@main/oke.js"></script>
<!--script src="collision.js"></script-->
<script>
let kanvas =  document.getElementById("kanvasGame");
kanvas.width = 1000;
kanvas.height = 1500;
let ctx = kanvas.getContext('2d');

addCanvasToLib("kanvasGame");

let box1 = {
	name:"box1",
	x:160,y:450,
	a:6,b:6,
	type:"sq",
	dynamicAng: true
	//rder:true
};
let box2 = {
        name:"box2",         
	x:260,y:500,
	a:40,b:20,
        type:"sq",
	click : halo,
	unclick : hai,
	border:true
};


function halo() {
	editProp("box1","vx",10);
	editProp("box1","vy",10);
	//el.vy = 10;
}
function hai() {      
	editProp("box1","vx",3);
	editProp("box1","vy",3);
	//el.vy = 3;
}

createElement(box1);
createElement(box2);
createJoyStick(80,500,20);

editJoyStick("joyStick0","attach","box1");

editJoyStick("joyStick0","isAngle",{From:330, To:30, Run:()=> console.log("78ihhj")});
function update() {
	ctx.clearRect(0,0,kanvasGame.width,kanvasGame.height);


	
	let sq1 = getProp("box1");
	ctx.fillStyle = "red";
        ctx.fillRect(sq1.x,sq1.y,sq1.w,sq1.h);
        ctx.fillStyle = "black";
	//ctx.fillRect(sq1.x-sq1.w/2,sq1.y-sq1.h/2,sq1.w,sq1.h);
	let sq2 = getProp("box2");        
	ctx.fillStyle = "red";
	//ctx.fillRect(220,480,80,40);
	console.log(sq1.sudut);
	ctx.fillStyle = "black";
	ctx.fillRect(sq2.x,sq2.y,sq2.w,sq2.h);

	ctx.font = "20px Arial";
	
	
	
	renderJoyStick("joyStick0");

	requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
